<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우사기 · 재생 화면</title><link rel="stylesheet" href="/style.css"><script defer src="/voice.js"></script><script defer src="/player.js"></script></head>
<body class="player-page"><main>
<header><span class="eyebrow">THE SHARED SCREEN</span><h1>우사기의 플레이리스트<span class="dot">.</span></h1></header>
<section id="login"><label for="token">재생기 토큰</label><div class="row"><input id="token" type="password" autocomplete="off" placeholder="config.local.json의 playerToken"><button id="connect">재생기 연결</button></div></section>
<p id="notice" role="status">토큰으로 연결한 뒤, 필요하면 재생 허용 버튼을 눌러 주세요.</p>
<div class="video-wrap" id="video-host"><div id="youtube"></div></div>
<section><h2 id="title">신청곡을 기다립니다</h2><button id="allow" hidden>소리 있는 재생 허용</button><p class="muted">영상과 플레이어를 화면에 표시한 상태로 사용하세요.</p></section>
</main></body></html>
