<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office Jukebox</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><main>
<header><span class="eyebrow">A LITTLE MUSIC, TOGETHER</span><h1>Office Jukebox<span class="dot">.</span></h1><p>채팅으로 모은 음악을, 하나의 화면에서.</p></header>
<section id="login"><label for="token">관리자 토큰</label><div class="row"><input id="token" type="password" autocomplete="off" placeholder="config.local.json의 adminToken"><button id="connect">연결</button></div><p class="muted">이 탭에서만 인증을 유지합니다. 인터넷에 이 서버를 직접 노출하지 마세요.</p></section>
<div id="dashboard" hidden>
<section><div class="row spread"><span class="eyebrow">NOW PLAYING</span><span id="mode" class="badge"></span></div><h2 id="title">아직 재생 중인 곡이 없습니다</h2><p id="status"></p><div class="row"><button data-command="다음">다음 곡</button><button data-command="정지" class="secondary">정지 · 대기열 비우기</button><button data-command="재시도" class="secondary">오류 재시도</button><button data-command="확인" class="secondary">현장 재생 확인</button></div></section>
<section><div class="row"><button data-command="일시정지" class="secondary">일시정지</button><button data-command="계속" class="secondary">계속 재생</button></div></section>
<section><label for="query">신청곡</label><form id="request" class="row"><input id="query" maxlength="300" required placeholder="곡명 또는 YouTube URL"><button type="submit">추가</button><button type="button" id="search" class="secondary">검색 후 선택</button></form><p class="muted">바로 추가는 검색 첫 결과를 신청합니다. 원하는 영상의 URL을 사용하거나 검색 후 번호를 선택하세요.</p><p id="feedback" role="status"></p><div class="row" id="choices" hidden><button data-command="선택 1">1번</button><button data-command="선택 2">2번</button><button data-command="선택 3">3번</button><button data-command="선택 4">4번</button><button data-command="선택 5">5번</button></div></section>
<section><span class="eyebrow">UP NEXT</span><ol id="queue"></ol><p id="empty" class="muted">다음 음악을 기다리고 있어요.</p><p id="notifications" class="muted"></p></section>
</div><footer><a href="/player" target="_blank" rel="noopener">재생 화면 열기 ↗</a><span>개인 프로젝트 · v0.1</span></footer>
</main></body></html>
